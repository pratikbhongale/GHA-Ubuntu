name: context variable
on:
 push:
jobs:
 context-demo:
  runs-on: ubuntu-latest
  steps:
   - name: using context variable
     run: |
      echo "This workflow is triggered by ${{ github.actor }}"
      echo "The repository name ${{ github.repository }}"
      echo "The branch is ${{ github.ref_name }}"
   - name: print all variable under github
     run: echo "${{ toJson(github) }}"
   - name: Print all the environment variables
     run: echo "$GITHUB_SHA"
